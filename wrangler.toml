name = "statsforge"
main = "build/worker/shim.mjs"
compatibility_date = "2024-09-23"

[build]
command = ". $HOME/.cargo/env && cargo install -q worker-build && worker-build --release -- --no-default-features --features workers"

# Set GITHUB_TOKEN as a secret (never in this file):
